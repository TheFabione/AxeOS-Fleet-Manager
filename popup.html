<!DOCTYPE html>
<html lang="en" data-theme="circuit">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;background:var(--bg);color:var(--text);font:14px/1.4 Archivo,system-ui,sans-serif;padding:14px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.head h1{font-size:14px;font-weight:750;font-stretch:105%}
.head small{display:block;font-size:11px;color:var(--text-3);font-weight:500}
.sync{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.dot.live{background:var(--ok)}.dot.warn{background:var(--warn)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lbl{font-size:11px;color:var(--text-3);font-weight:600}
.big{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.big b{font-size:38px;font-weight:750;font-stretch:68%;letter-spacing:-.01em;line-height:1;color:var(--text)}
.big span{font-size:13px;color:var(--text-2);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.row div{display:flex;flex-direction:column}
.row strong{font-size:15px;font-stretch:85%;font-weight:700}
.list{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow:auto}
.dev{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--surface);font-size:13px}
.dev .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dev.off .d{background:var(--bad)}
.dev.off{color:var(--text-3)}
.dev .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dev .v{font-stretch:85%;font-weight:650;color:var(--text-2)}
.dev.off .v{color:var(--bad);font-size:12px}
.empty{font-size:13px;color:var(--text-2);text-align:center;padding:10px}
.btn{width:100%;height:38px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 13.5px Archivo,system-ui,sans-serif;cursor:pointer}
.btn:hover{background:var(--accent-strong)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.foot{text-align:center;font-size:10.5px;color:var(--text-3)}
</style>
</head>
<body>
  <div class="head">
    <div class="mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/><rect x="9.2" y="9.2" width="5.6" height="5.6" rx="1" transform="rotate(45 12 12)" fill="currentColor" stroke="none"/></svg></div>
    <div><h1>Fleet Manager</h1><small>BitAxe · NerdQAxe</small></div>
    <span class="sync"><span class="dot" id="dot"></span><span id="ago">--</span></span>
  </div>
  <section class="hero">
    <span class="lbl">Fleet hashrate</span>
    <div class="big"><b id="hr">--</b><span id="unit">GH/s</span></div>
    <div class="row">
      <div><span class="lbl">Online</span><strong id="on">--</strong></div>
      <div><span class="lbl">Power</span><strong id="pw">--</strong></div>
      <div><span class="lbl">Best diff</span><strong id="bd">--</strong></div>
    </div>
  </section>
  <div class="list" id="list"></div>
  <button class="btn" id="open">Open dashboard</button>
  <div class="foot" id="ver"></div>
  <script src="popup.js"></script>
</body>
</html>
